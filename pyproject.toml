[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industrial-edge-process-logger"
version = "0.1.0"
description = "Reliable read-only industrial telemetry with synthetic demonstrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "XlsxWriter>=3.2",
  "openpyxl>=3.1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
opcua = ["asyncua>=2.0.1,<3"]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13", "asyncua>=2.0.1,<3"]

[project.scripts]
edge-logger = "edge_logger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_logger"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider --basetemp=pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["edge_logger"]
